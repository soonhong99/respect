[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "respect"
version = "0.1.0"
description = "RESPECT: reuse-based speculative decoding with temporal drafts for reasoning VLA models"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
  "torch>=2.8",
  "transformers==4.57.1",
  "triton>=3.4",
  "numpy",
  "einops",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["respect*"]
